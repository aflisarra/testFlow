<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="card-title mb-0">All Users</h4>
        <button class="btn btn-sm btn-primary" (click)="loadUsers()">Refresh</button>
      </div>
      <div class="card-body">
        @if (loading) {
          <p class="text-muted mb-0">Loading users...</p>
        }

        @if (error) {
          <div class="alert alert-danger mb-0">{{ error }}</div>
        }

        @if (!loading && !error) {
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody>
                @for (user of users; track user._id) {
                  <tr>
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td><span class="badge bg-secondary-subtle text-dark">{{ user.role }}</span></td>
                    <td>{{ user.description || '-' }}</td>
                  </tr>
                }

                @if (users.length === 0) {
                  <tr>
                    <td colspan="4" class="text-center text-muted py-4">No users found</td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        }
      </div>
    </div>
  </div>
</div>
