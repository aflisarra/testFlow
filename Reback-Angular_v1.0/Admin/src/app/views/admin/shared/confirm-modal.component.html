<div class="confirm-dialog">
  <div class="confirm-top">
    <button type="button" class="btn-close confirm-close" aria-label="Close"
      (click)="activeModal.dismiss(false)"></button>
  </div>

  <div class="confirm-body">
    <div class="confirm-icon">
      <iconify-icon [icon]="icon" class="confirm-icon-svg"></iconify-icon>
    </div>

    <h2 class="confirm-title brand-title">{{ title }}</h2>

    <p class="confirm-message">
  {{ message }}
  @if (entityName) {
    <span class="confirm-entity">{{ entityName }}</span>?
      }
      @if (details) {
      <span class="confirm-details">{{ details }}</span>
      }
    </p>

    @if (hasSelect) {
      <div class="confirm-field">
        @if (selectLabel) {
          <label class="confirm-label" for="confirm-modal-select">{{ selectLabel }}</label>
        }
        <select
          id="confirm-modal-select"
          class="form-select confirm-select"
          [(ngModel)]="selectedValue"
        >
          <option value="">{{ selectPlaceholder }}</option>
          @for (option of selectOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
    }

    <div class="confirm-actions d-flex justify-content-center gap-2">
      <button
        type="button"
        class="btn btn-lg"
        [ngClass]="confirmButtonClass"
        [disabled]="confirmDisabled"
        (click)="confirm()"
      >
        {{ confirmText }}
      </button>

      @if (showCancel) {
        <button type="button" class="btn btn-lg btn-confirm-cancel" (click)="activeModal.dismiss(false)">
          {{ cancelText }}
        </button>
      }
    </div>
  </div>

  <div class="confirm-tonal"></div>
</div>
