<div class="confirm-dialog">
  <div class="confirm-top">
    <button type="button" class="btn-close confirm-close" aria-label="Close" (click)="activeModal.dismiss(false)"></button>
  </div>

  <div class="confirm-body">
    <div class="confirm-icon">
      <iconify-icon [icon]="icon" class="confirm-icon-svg"></iconify-icon>
    </div>

    <h2 class="confirm-title brand-title">{{ title }}</h2>

    <p class="confirm-message">
      {{ message }}
      @if (entityName) {
        <span class="confirm-entity">{{ entityName }}</span>.
      }
      @if (details) {
        <span class="confirm-details">{{ details }}</span>
      }
    </p>

    <div class="confirm-actions">
      <button type="button" class="btn btn-lg w-100" [ngClass]="confirmButtonClass" (click)="activeModal.close(true)">
        {{ confirmText }}
      </button>
      <button type="button" class="btn btn-lg w-100 btn-confirm-cancel" (click)="activeModal.dismiss(false)">
        {{ cancelText }}
      </button>
    </div>
  </div>

  <div class="confirm-tonal"></div>
</div>
