<div class="execution-history">

  <!-- FILTERS -->
  <div class="filters-bar">


  <!-- ✅ DATE -->

  <!-- DATE -->
  <div class="filter-group">
    <label class="filter-label">DATE RANGE</label>
    <div class="filter-select-wrapper">
      
<select
  [value]="filters.dateRange"
  (change)="onFilterChange('dateRange', $event)"
>
  <option value="">All Dates</option>
  <option value="1day">Last 1 Day</option>
  <option value="2days">Last 2 Days</option>
  <option value="3days">Last 3 Days</option>
  <option value="7days">Last 7 Days</option>
  <option value="30days">Last 30 Days</option>
</select>

    </div>
  </div>



   
 <!-- ✅ STATUS -->
 
  <div class="filter-group">
    <label class="filter-label">STATUS</label>
    <select
      [value]="filters.status"
      (change)="onFilterChange('status', $event)"
    >
      <option value="">All</option>
      <option value="passed">Passed</option>
      <option value="failed_execution">Failed Execution</option>
      <option value="failed_assertion">Failed Assertion</option>
      <option value="failed">Failed</option>
      <option value="aborted">Aborted</option>
      <option value="running">Running</option>
    </select>
  </div>






  <!-- ✅ PROJECT -->

  <div class="filter-group">
    <label class="filter-label">PROJECT</label>
    <select
      [value]="filters.project"
      (change)="onFilterChange('project', $event)"
    >
      <option value="">All Projects</option>

      @for (p of projects; track p._id) {
        <option [value]="p._id">{{ p.title }}</option>
      }
    </select>
  </div>



    <!-- ✅ SUITE -->

  <!-- ✅ SUITE -->

  <div class="filter-group">
    <label class="filter-label">SUITE</label>
    <select
      [value]="filters.suite"
      [disabled]="!filters.project"
      (change)="onFilterChange('suite', $event)"
    >
      <option value="">All Suites</option>

      @for (s of suites; track s._id) {
        <option [value]="s._id">
          {{ s.nom || s.nametest }}
        </option>
      }
    </select>
  </div>



 
  <!-- ✅ TEST PLAN -->

  <!-- TEST PLAN -->
  <div class="filter-group">
    <label class="filter-label">TEST PLAN</label>
    <select
      [value]="filters.testPlan"
      [disabled]="!filters.suite"
      (change)="onFilterChange('testPlan', $event)"
    >
      <option value="">All Plans</option>

      @for (plan of plans; track plan._id) {
        <option [value]="plan._id">{{ plan.title }}</option>
      }
    </select>
  </div>

  <!-- APPLY -->
  <button class="btn-apply" (click)="applyFilters()">
    Apply Filters
  </button>

</div>

<div class="table-wrapper">
  <table class="exec-table">

    <thead>
      <tr>
        <th>Test Case</th>
        <th>Executed By</th>
        <th>Status</th>
        <th>Execution Date</th>
        <th>Duration</th>
      </tr>
    </thead>

    <tbody>

      @for (run of filteredRuns; track run.id) {

        <tr
          (click)="openExecution(run)"
          style="cursor:pointer"
        >

          <td>
            <b>{{ run.testCaseName }}</b>
            <br />
            <small>{{ run.id }}</small>
          </td>

          <td>
            {{ run.executedBy }}
          </td>

          <td>
            <span class="status-badge status-{{ run.status }}">
              {{ run.status }}
            </span>
          </td>

          <td>
            {{ run.executionDate }}
            <br />
            <small>{{ run.executionTime }}</small>
          </td>

          <td>
            {{ run.duration }}
          </td>

        </tr>

      } @empty {

        <tr>
          <td colspan="5" style="text-align:center;">
            No executions found
          </td>
        </tr>

      }

    </tbody>

  </table>
</div>

<app-execution-details
  [execution]="selectedExecution"
  [visible]="isModalOpen"
  (closed)="isModalOpen = false"
></app-execution-details>
