@if (isOpen && draft) {
<div
  class="tc-modal-backdrop"
  role="button"
  tabindex="0"
  (click)="onClose()"
  (keydown.enter)="onClose()"
  (keydown.space)="onClose()"
></div>
<div class="tc-modal-wrap" role="dialog" aria-modal="true" aria-labelledby="planEditTitle">
  <div class="tc-modal-card tc-modal-card--plan">
    <div class="tc-modal-head tc-modal-head--plan">
      <div class="tc-modal-head-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </div>
      <div class="tc-modal-head-copy">
        <span class="tc-modal-plan-id">{{ draft.id }}</span>
        <h5 id="planEditTitle" class="tc-modal-title mb-0">
          {{ mode === 'add' ? 'Add Test Plan' : 'Edit Test Plan' }}
        </h5>
        <p class="tc-modal-subtitle mb-0">
          {{ mode === 'add' ? 'Create a manual test plan before saving your session.' : 'Refine the plan details before saving your updates.' }}
        </p>
      </div>
      <button class="btn-close confirm-close" type="button" aria-label="Close" (click)="onClose()"></button>
    </div>

    <div class="tc-modal-body tc-modal-body--plan custom-scrollbar">
      <div class="tc-modal-grid">
        <div class="tc-modal-field tc-modal-field--full">
          <div class="form-label">Title</div>
          <input class="form-control" [value]="draft.title" (input)="onFieldInput('title', $event)" />
        </div>
        <div class="tc-modal-field tc-modal-field--full">
          <div class="form-label">Description</div>
          <textarea class="form-control tc-modal-textarea" rows="4" [value]="draft.description" (input)="onFieldInput('description', $event)"></textarea>
        </div>
        <div class="tc-modal-field">
          <div class="form-label">Objective</div>
          <textarea class="form-control tc-modal-textarea" rows="4" [value]="draft.objective || ''" (input)="onFieldInput('objective', $event)"></textarea>
        </div>
        <div class="tc-modal-field">
          <div class="form-label">Scope</div>
          <textarea class="form-control tc-modal-textarea" rows="4" [value]="draft.scope || ''" (input)="onFieldInput('scope', $event)"></textarea>
        </div>
        <div class="tc-modal-field tc-modal-field--full">
          <div class="form-label">Priority</div>
          <select class="form-select" [value]="draft.priority || 'Medium'" (change)="onFieldInput('priority', $event)">
            <option>Critical</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </div>
      </div>
    </div>

    <div class="tc-modal-actions tc-modal-actions--plan">
      <button type="button" class="btn btn-cancel px-4" (click)="onClose()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-inline-end: 6px; vertical-align: -3px;">
          <path d="M18 6L6 18"/>
          <path d="M6 6l12 12"/>
        </svg>
        Cancel
      </button>
      <button type="button" class="btn btn-brand px-4" (click)="onSave()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-inline-end: 6px; vertical-align: -3px;">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        {{ mode === 'add' ? 'Add plan' : 'Save changes' }}
      </button>
    </div>
  </div>
</div>
}
