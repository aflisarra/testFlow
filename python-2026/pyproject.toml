[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*.ipynb", ".ipynb_checkpoints", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These modules deliberately perform environment/path setup before app imports.
"main.py" = ["E402"]
"tests/pipeline_smoke.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  ".venv/*",
  "scripts/*",
  "tests/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
