services:

  frontend:
    build:
      context: ./Reback-Angular_v1.0/Admin
      dockerfile: Dockerfile
    container_name: pfe-frontend
    ports:
      - "4300:4200"
    volumes:
      - ./Reback-Angular_v1.0/Admin:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend-2026
      dockerfile: Dockerfile
    container_name: pfe-backend
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: development
      FASTAPI_BASE_URL: http://python-service:8000
      PYTHON_SERVICE_URL: http://python-service:8000
      OLLAMA_HOST: http://ollama:11434
      MONGODB_URI: mongodb://mongodb:27017/pfe1-2026
      SELENIUM_REMOTE_URL: http://selenium-chrome:4444
    volumes:
      - ./backend-2026:/app
      - /app/node_modules
    depends_on:
      python-service:
        condition: service_started
      ollama:
        condition: service_started
      mongodb:
        condition: service_started
      selenium-chrome:
        condition: service_healthy
    restart: unless-stopped

  selenium-chrome:
    image: selenium/standalone-chrome:4.35.0
    container_name: pfe-selenium-chrome
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 4
      SE_SESSION_REQUEST_TIMEOUT: 300000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4444/status | grep -q '\"ready\": true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  python-service:
    build:
      context: ./python-2026
      dockerfile: Dockerfile
    container_name: pfe-python
    ports:
      - "8100:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_TIMEOUT: 420
      OLLAMA_TEST_PLANS_TIMEOUT: 420
      OLLAMA_TEST_CASES_TIMEOUT: 420
    volumes:
      - ./python-2026:/app
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: pfe-ollama
    ports:
      - "12434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: pfe-mongodb
    ports:
      - "28017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  ollama_data:
  mongodb_data: