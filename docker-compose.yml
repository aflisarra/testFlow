services:

  frontend:
    build:
      context: ./Reback-Angular_v1.0/Admin
      dockerfile: Dockerfile
    container_name: pfe-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./Reback-Angular_v1.0/Admin:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend-2026
      dockerfile: Dockerfile
    container_name: pfe-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      FASTAPI_BASE_URL: http://python-service:8000
      PYTHON_SERVICE_URL: http://python-service:8000
      OLLAMA_HOST: http://ollama:11434
      MONGODB_URI: mongodb://mongodb:27017/pfe1-2026
    volumes:
      - ./backend-2026:/app
      - /app/node_modules
    depends_on:
      - python-service
      - ollama
      - mongodb
    restart: unless-stopped

  python-service:
    build:
      context: ./python-2026
      dockerfile: Dockerfile
    container_name: pfe-python
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_TIMEOUT: 420
      OLLAMA_TEST_PLANS_TIMEOUT: 420
      OLLAMA_TEST_CASES_TIMEOUT: 420
    volumes:
      - ./python-2026:/app
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: pfe-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: pfe-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  ollama_data:
  mongodb_data: